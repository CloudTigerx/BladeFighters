name: Cleanup CI

on:
  pull_request:
    branches:
      - 'cleanup/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONWARNINGS: default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install vulture

      - name: Reactor boundary guard
        shell: bash
        run: |
          git fetch origin main --depth=1 || true
          CHANGED=$(git diff --name-only origin/main... || true)
          echo "$CHANGED" | grep -E '^(core/puzzle_module\.py|modules/attack_module/attack_calculator\.py)$' && {
            echo "Reactor files are read-only; changes detected. Failing CI.";
            exit 1;
          } || echo "No reactor violations detected."

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q

      - name: Generate cleanup reports (artifacts)
        run: |
          python tools/cleanup/dead_code_report.py || true
          python tools/cleanup/orphan_assets.py || true
          python tools/cleanup/unused_tests.py || true

      - name: Upload cleanup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-reports
          path: build/cleanup/*.json

