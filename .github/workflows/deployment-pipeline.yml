name: Deployment Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'core/**'
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy (optional)'
        required: false
        default: 'all'
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  pre-deployment-validation:
    runs-on: ubuntu-latest
    outputs:
      modules-to-deploy: ${{ steps.detect-changes.outputs.modules }}
      deployment-type: ${{ steps.detect-changes.outputs.type }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: detect-changes
        run: |
          echo "🔍 Detecting module changes..."
          
          # Get changed modules
          if [ "${{ github.event.inputs.module }}" != "all" ]; then
            MODULES="${{ github.event.inputs.module }}"
            TYPE="manual"
          else
            # Detect changed modules from git
            CHANGED_FILES=$(git diff --name-only HEAD~1)
            MODULES=""
            
            for module in audio_module screen_module input_module settings_module game_state_module; do
              if echo "$CHANGED_FILES" | grep -q "modules/$module/"; then
                MODULES="$MODULES $module"
              fi
            done
            
            if [ -z "$MODULES" ]; then
              MODULES="all"
            fi
            TYPE="automatic"
          fi
          
          echo "modules=$MODULES" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          
          echo "📦 Modules to deploy: $MODULES"
          echo "🚀 Deployment type: $TYPE"

      - name: Validate deployment readiness
        run: |
          echo "✅ Validating deployment readiness..."
          
          # Check if all required tests pass
          python -m pytest tests/integration/ -v --tb=short
          
          # Check documentation coverage
          python tools/documentation_automation.py validate
          
          # Check for critical issues
          python tools/critical_issue_detector.py

  staging-deployment:
    runs-on: ubuntu-latest
    needs: pre-deployment-validation
    if: github.event.inputs.environment == 'staging' || github.event.inputs.environment == ''
    environment: staging
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          
          MODULES="${{ needs.pre-deployment-validation.outputs.modules-to-deploy }}"
          
          for module in $MODULES; do
            echo "📦 Deploying module: $module"
            python tools/module_deployer.py --module $module --environment staging --incremental
          done

      - name: Run post-deployment tests
        run: |
          echo "🧪 Running post-deployment tests..."
          python tools/post_deployment_tester.py --environment staging

      - name: Performance validation
        run: |
          echo "⚡ Validating performance..."
          python tools/performance_validator.py --environment staging --baseline production

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          python tools/health_checker.py --environment staging --timeout 300

  production-deployment:
    runs-on: ubuntu-latest
    needs: [pre-deployment-validation, staging-deployment]
    if: github.event.inputs.environment == 'production'
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create deployment snapshot
        id: snapshot
        run: |
          echo "📸 Creating deployment snapshot..."
          SNAPSHOT_ID=$(python tools/snapshot_creator.py --environment production)
          echo "snapshot-id=$SNAPSHOT_ID" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          
          MODULES="${{ needs.pre-deployment-validation.outputs.modules-to-deploy }}"
          
          for module in $MODULES; do
            echo "📦 Deploying module: $module"
            python tools/module_deployer.py --module $module --environment production --incremental --snapshot ${{ steps.snapshot.outputs.snapshot-id }}
          done

      - name: Run post-deployment tests
        run: |
          echo "🧪 Running post-deployment tests..."
          python tools/post_deployment_tester.py --environment production

      - name: Performance validation
        run: |
          echo "⚡ Validating performance..."
          python tools/performance_validator.py --environment production --baseline staging

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          python tools/health_checker.py --environment production --timeout 300

      - name: Update deployment status
        run: |
          echo "📊 Updating deployment status..."
          python tools/deployment_status_updater.py --environment production --status success --snapshot ${{ steps.snapshot.outputs.snapshot-id }}

  rollback-monitor:
    runs-on: ubuntu-latest
    needs: [staging-deployment, production-deployment]
    if: always()
    
    steps:
      - name: Check deployment health
        run: |
          echo "🔍 Monitoring deployment health..."
          
          # Check for critical errors
          python tools/error_monitor.py --environment production --threshold 5
          
          # Check performance degradation
          python tools/performance_monitor.py --environment production --threshold 0.2
          
          # Check integration issues
          python tools/integration_monitor.py --environment production

      - name: Trigger rollback if needed
        if: failure()
        run: |
          echo "🔄 Triggering rollback..."
          python tools/rollback_trigger.py --environment production --reason "deployment-failure"

  deployment-report:
    runs-on: ubuntu-latest
    needs: [staging-deployment, production-deployment, rollback-monitor]
    if: always()
    
    steps:
      - name: Generate deployment report
        run: |
          echo "📊 Generating deployment report..."
          python tools/deployment_reporter.py --output deployment-report.json

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment-report.json

      - name: Notify team
        if: always()
        run: |
          echo "📢 Notifying team of deployment status..."
          python tools/notification_sender.py --report deployment-report.json
